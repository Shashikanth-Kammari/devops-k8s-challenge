name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: shashikanthchary/devops-demo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest app/ -v

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build             -t $IMAGE_NAME:${{ github.sha }}             -t $IMAGE_NAME:latest .

      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      # Configure AWS credentials using OIDC in the challenge environment.
      # Required repository secrets/variables depend on your EKS setup.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig             --region "${{ secrets.AWS_REGION }}"             --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend.yaml

      - name: Deploy new image
        run: |
          kubectl set image deployment/backend             backend=$IMAGE_NAME:${{ github.sha }}             -n devops-demo

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend             -n devops-demo             --timeout=120s
          kubectl get pods -n devops-demo
