# NOTE: For the video/demo this is a plain Secret (base64, NOT encrypted) so the
# pipeline is fully self-contained and reviewable without extra infra.
# In a real production cluster this would be sealed-secrets, External Secrets
# Operator (pulling from AWS Secrets Manager / Vault), or SOPS — never committed
# in plaintext to git the way this demo file is. Called out explicitly in the
# tradeoffs section of DEMO_SCRIPT.md.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-challenge
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: supersecretpassword
  POSTGRES_DB: appdb
